[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruma-ppo"
version = "0.1.0"
description = "HITSZ RMUA PPO research"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["ruma_ppo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[project.scripts]
ruma-train = "ruma_ppo.cli.train_joint:main"
ruma-setup = "ruma_ppo.cli.setup_hitsz:main"
ruma-eval = "ruma_ppo.evaluation.harness:main"
